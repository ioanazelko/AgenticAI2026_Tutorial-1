theory_to_observable_routing:
  routes:
  - id: route_sidm_transfer_function
    description: Compute interacting dark-sector kinetic decoupling and the damped matter transfer function,
      then compare with Lyman-alpha limits.
    source_model_features:
    - dark photon mediator
    - light dark fermion bath
    - late kinetic decoupling
    input_parameters:
    - m_chi
    - m_phi
    - g_chi
    - g_f
    - xi
    derived_quantities:
    - T_kd
    - damping scale
    - linear transfer function
    - WDM-equivalent mass
    forward_model_chain:
    - step_id: solve_momentum_transfer
      step_type: analytic_formula
      tool_or_code: SIDM-dark-radiation scattering rate
      inputs:
      - m_chi
      - m_phi
      - g_chi
      - g_f
      - xi
      outputs:
      - T_kd
      validity: Radiation-era kinetic decoupling approximation.
      notes: Primary paper provides an approximate T_kd scaling.
    - step_id: compute_transfer
      step_type: transfer_function
      tool_or_code: Boltzmann or fitted dark-acoustic damping transfer function
      inputs:
      - T_kd
      - xi
      outputs:
      - suppressed matter power spectrum
      validity: Requires accurate treatment of interacting dark radiation.
      notes: Use Lyman-alpha-compatible transfer function output.
    - step_id: apply_lyman_alpha
      step_type: likelihood
      tool_or_code: Lyman-alpha forest likelihood or WDM recast
      inputs:
      - transfer function
      outputs:
      - allowed damping scale
      validity: Only as robust as the WDM/interacting-radiation mapping.
      notes: Primary paper uses recent Lyman-alpha constraints qualitatively in the OCR text.
    observable_ids:
    - sidm_dark_acoustic_damping
    constraint_ids:
    - sidm_lyman_alpha_damping_bound
    likelihoods:
    - Lyman-alpha forest likelihood or validated WDM-equivalent recast
    required_code_resources:
    - Boltzmann solver with interacting dark radiation
    - Lyman-alpha likelihood/recast
    validation_tests:
    - Recover the paper statement that satellite suppression is strongly limited by Lyman-alpha data.
    route_status: planned
    agent_notes: Most important cosmological route for this model card.
    caveats:
    - Lyman-alpha thermal-history nuisance parameters are not encoded here.
