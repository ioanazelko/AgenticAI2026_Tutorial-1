observables:
- id: multifield_stellar_heating
  name: Reduced ULDM granularity and stellar heating
  channel: dwarf_galaxies
  subchannel: stellar velocity dispersion in ULDM halos
  predicted_effect: For N equal-mass ultralight fields the total density fluctuations are reduced relative
    to single-field ULDM, and the primary paper gives a stellar-heating contribution scaling as 1/(N m^3);
    when one field is much lighter, the lightest mass controls the heating with a different N-dependent
    scaling.
  effect_direction: suppression
  key_quantities:
  - name: number of fields
    symbol: N
    role: core
    status: assumed
    source_reference_ids:
    - '2301_07114'
  - name: field masses
    symbol: m_i
    role: core
    status: assumed
    source_reference_ids:
    - '2301_07114'
  - name: stellar velocity dispersion contribution
    symbol: sigma_*
    role: derived
    status: inferred
    source_reference_ids:
    - '2301_07114'
  redshift_range: low redshift halos
  scale_range: subgalactic halo cores and stellar systems
  environments:
  - ultrafaint dwarf galaxies
  - stellar systems embedded in ULDM halos
  observability: medium
  relevance: high
  linked_constraints:
  - stellar_heating_recast
  linked_routes:
  - sp_density_to_stellar_heating
  caveats:
  - Scaling is analytic and simulation-backed in idealized halos; baryonic effects and detailed galaxy
    histories are not included.
  source_reference_ids:
  - '2301_07114'
  - '1810_08543'
  notes: This observable weakens single-field stellar-heating exclusions when multiple uncorrelated fields
    contribute.
