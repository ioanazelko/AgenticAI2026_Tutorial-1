constraints:
- id: stellar_heating_recast
  name: Recast stellar-heating limits for N-field ULDM
  constraint_type: astrophysical
  observable_channel: dwarf_galaxies
  applies: recast_required
  constrained_parameters:
  - N
  - m_i
  - m_L
  - stellar velocity dispersion
  excluded_regions:
  - Single-field stellar-heating exclusions cannot be applied unchanged when uncorrelated fields smooth
    the density granularity.
  allowed_regions:
  - Larger N weakens stellar-heating constraints at fixed equal field mass in the primary-paper scaling.
  benchmark_implications:
  - Multifield ULDM can reopen some parameter space excluded by single-field granularity heating, subject
    to a dedicated halo and stellar-population recast.
  likelihood_available: 'no'
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: medium
  assumptions: []
  caveats:
  - The primary scaling is not a released likelihood and depends on halo modeling.
  source_reference_ids:
  - '2301_07114'
  - '1810_08543'
  notes: Use as a recast route, not as a final exclusion contour.
- id: lya_single_field_bound_recast
  name: Canonical ULA Lyman-alpha mass lower bound
  constraint_type: cosmological
  observable_channel: lyman_alpha
  applies: recast_required
  constrained_parameters:
  - m_i
  - f_i
  excluded_regions:
  - The related Lyman-alpha paper reports m_a > 2e-20 eV at 95 percent credibility for canonical all-of-DM
    ultra-light axions.
  allowed_regions:
  - Multifield or mixed-fraction cases require a recomputed transfer function and likelihood.
  benchmark_implications:
  - A model with dominant fields in the canonical 1e-22 to 1e-21 eV band is under strong pressure unless
    the multifield/fractional composition changes the power-spectrum response.
  likelihood_available: partial
  likelihood_reference: null
  data_release: null
  recasting_needed: 'yes'
  robustness: high
  assumptions: []
  caveats:
  - Do not apply the single-field all-DM number directly to arbitrary N-field mixtures.
  source_reference_ids:
  - '2007_12705'
  - '2301_07114'
  notes: The bound is logged as a strong external constraint requiring model-specific recasting.
theory_to_observable_routing:
  routes:
  - id: sp_density_to_stellar_heating
    description: Evolve N-field Schroedinger-Poisson halos, measure density granularity, and propagate
      the granularity spectrum to stellar velocity-dispersion heating.
    source_model_features:
    - N independent real scalar fields
    - only gravitational interactions
    - uncorrelated wave granules
    input_parameters:
    - N
    - m_i
    - halo density profile
    - stellar distribution
    derived_quantities:
    - granularity amplitude
    - heating rate
    - stellar velocity dispersion
    forward_model_chain:
    - step_id: sp_simulation
      step_type: simulation
      tool_or_code: Schroedinger-Poisson solver described in the primary paper
      inputs:
      - N
      - m_i
      - initial halo state
      outputs:
      - time-dependent density field
      validity: Nonrelativistic ULDM halo regime.
      notes: The primary paper reports multifield halo simulations.
    - step_id: stellar_heating_estimate
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - density-fluctuation amplitude
      - m_i
      - N
      outputs:
      - velocity-dispersion scaling
      validity: Idealized stellar tracer and halo assumptions.
      notes: Equal-mass scaling and lightest-field scaling are analytic estimates.
    observable_ids:
    - multifield_stellar_heating
    constraint_ids:
    - stellar_heating_recast
    likelihoods: []
    required_code_resources:
    - Primary-paper simulation/analysis; no public likelihood identified.
    validation_tests:
    - Recover single-field limit at N=1
    - Check equal-mass 1/(N m^3) scaling
    route_status: partially_implemented
    agent_notes: Suitable for a dedicated recast rather than a plug-in likelihood.
    caveats:
    - Baryons, anisotropic stellar distributions, and halo assembly history remain caveats.
  - id: transfer_function_to_lya
    description: Compute the multifield ULDM linear transfer function and compare against Lyman-alpha
      flux-power likelihoods.
    source_model_features:
    - multifield ultralight masses and fractions
    - scale-dependent suppression
    input_parameters:
    - m_i
    - f_i
    - cosmological parameters
    derived_quantities:
    - matter transfer function
    - flux-power prediction
    forward_model_chain:
    - step_id: linear_power
      step_type: boltzmann_solver
      tool_or_code: ULA/mixed-DM Boltzmann treatment
      inputs:
      - m_i
      - f_i
      outputs:
      - matter power spectrum
      validity: Linear and mildly nonlinear scales relevant to Lyman-alpha.
      notes: The related constraint paper provides a canonical single-field benchmark.
    - step_id: forest_likelihood
      step_type: likelihood
      tool_or_code: Lyman-alpha emulator/likelihood
      inputs:
      - matter power spectrum
      - IGM nuisance parameters
      outputs:
      - posterior on masses and fractions
      validity: Requires matching data and nuisance model of the Lyman-alpha analysis.
      notes: No multifield likelihood was found in the primary paper.
    observable_ids:
    - uldm_small_scale_power_cutoff
    constraint_ids:
    - lya_single_field_bound_recast
    likelihoods:
    - Lyman-alpha forest flux-power likelihood from related literature
    required_code_resources:
    - Boltzmann/transfer solver for ULA mixtures
    - Lyman-alpha emulator or published likelihood
    validation_tests:
    - Recover canonical single-field bound before extending to N fields
    route_status: planned
    agent_notes: Primary-paper statements identify the constraint class, but the multifield likelihood
      is not provided.
    caveats:
    - Thermal history and fractional-DM assumptions can weaken or alter bounds.
