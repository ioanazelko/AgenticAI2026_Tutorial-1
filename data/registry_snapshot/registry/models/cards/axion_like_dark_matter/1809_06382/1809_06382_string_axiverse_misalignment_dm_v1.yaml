  short_description: A string-axiverse axion dark matter framework parameterized by SUSY-breaking scale,
    instanton action, initial misalignment angle, and isocurvature fraction, with relic abundance from
    misalignment constrained not to exceed CDM.
  historical_origin_or_motivation: The paper develops a cosmological parameter inference window onto the
    string axiverse and the supersymmetry-breaking scale using relic-density and isocurvature requirements.
  status: emerging
  model_kind: phenomenological_parameterization
