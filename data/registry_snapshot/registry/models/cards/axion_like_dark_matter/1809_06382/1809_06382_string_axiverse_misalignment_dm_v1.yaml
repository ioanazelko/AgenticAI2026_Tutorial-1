  mediators: []
  dark_radiation_species: []
  standard_model_extension: minimal
symmetries:
  stabilizing_mechanism: Approximate axion shift symmetry broken by non-perturbative instanton effects
    gives a light, long-lived scalar field; decay-rate cuts require lifetime longer than the present expansion
    time.
  symmetries:
  - name: axion shift symmetry
    type: shift
    exact_or_approximate: broken
    breaking: Broken by string instantons generating the axion potential
    breaking_scale: null
  topological_defects_possible: unknown
