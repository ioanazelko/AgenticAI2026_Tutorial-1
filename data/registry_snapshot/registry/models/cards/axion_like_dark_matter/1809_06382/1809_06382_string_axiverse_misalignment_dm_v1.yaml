    role: core
    status: unknown
  - name: instanton action
    symbol: S
    description: Dimensionless action of string instantons that break the shift symmetry.
    value: 198 +/- 28
    role: core
    status: inferred
  - name: initial misalignment angle
    symbol: theta_i
    description: Initial axion misalignment angle sampled from the unit circle.
    range: '[-pi, pi]'
    role: core
    status: assumed
  - name: primordial isocurvature fraction
    symbol: alpha
    description: Parameter constrained by Planck and used in the likelihood.
    role: cosmological
    status: established
production:
