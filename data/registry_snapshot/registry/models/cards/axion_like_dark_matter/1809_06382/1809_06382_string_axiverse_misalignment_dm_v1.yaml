  - axion-like particles
  - misalignment-produced dark matter
  lagrangian_available: partial
  renormalizable: not_applicable
  embedded_in_larger_framework: 'yes'
  notes: The paper gives an effective four-dimensional axion Lagrangian from compactification and parameterizes
    mass/decay constant through instanton action and SUSY scale.
