  - gravitational
  standard_model_targets:
  - photons through possible axion decay considered as a lifetime cut
  - gravity/cosmological expansion
  dark_sector_couplings: []
  mediator_types: []
  interaction_operators:
  - effective kinetic term f_a^2 (partial theta)^2 / 2 and potential scale Lambda_a^4 theta^2 / 2 in small-angle
    approximation
  scattering:
    elastic: not_applicable
    inelastic: not_applicable
    momentum_dependence: not_applicable
    velocity_dependence: not_applicable
    spin_dependence: not_applicable
  decay_channels:
  - two photons considered for lifetime requirement
