  short_description: A Z2-odd electroweak-scale radiative neutrino mass model in which the lightest right-handed
    neutrino N_1 is stable dark matter and nearly degenerate N_2 enables coannihilation and loop-induced
    inelastic photon-mediated nuclear scattering.
  historical_origin_or_motivation: The paper studies a Ma radiative neutrino mass setup as a joint TeV-scale
    origin for neutrino masses and dark matter, emphasizing the nearly degenerate N_1/N_2 leptophilic
    direct-detection regime.
  status: speculative
  model_kind: complete_theory
