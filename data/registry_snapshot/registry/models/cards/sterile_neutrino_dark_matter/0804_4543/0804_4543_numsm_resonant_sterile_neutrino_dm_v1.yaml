identity:
  name: nuMSM lepton-asymmetry resonant sterile-neutrino dark matter
  family: sterile_neutrino_dark_matter
  aliases:
  - MSM-induced lepton-asymmetry sterile neutrino dark matter
  - Shi-Fuller resonant sterile neutrino production in the nuMSM
  short_description: A nuMSM scenario where CP-violating oscillations of the two heavier right-handed
    neutrinos generate a large lepton asymmetry, enabling resonant production of the lightest keV sterile
    neutrino as dark matter.
  historical_origin_or_motivation: The paper develops the parameter region where the nuMSM can explain
    active neutrino data, baryogenesis-related lepton asymmetry, and sterile-neutrino dark matter without
    adding a new scalar.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - nuMSM
  - Standard Model plus three right-handed neutrinos
  - Shi-Fuller resonant production
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  embedded_in_larger_framework: 'yes'
  notes: The paper starts from the nuMSM and writes the lightest right-handed neutrino Lagrangian with
    Majorana mass M_1 and Yukawa matrix elements F_alpha1 coupled to the Higgs and active lepton doublets.
particle_content:
  dark_matter_candidate:
    name: N1 lightest right-handed sterile neutrino
    spin: 1/2
    statistics: fermion
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - two heavier right-handed neutrinos N2 and N3
  mediators:
  - active-sterile mixing in the electroweak plasma
  dark_radiation_species: []
  excited_or_degenerate_states:
  - nearly degenerate heavier right-handed neutrinos in Scenario IIa
  long_lived_particles:
  - N1 sterile neutrino
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: No exact stabilizing symmetry is given; N1 is cosmologically long-lived because
    its Yukawa couplings and active-sterile mixing are extremely small.
  symmetries: []
  topological_defects_possible: unknown
interactions:
  portals:
  - neutrino
  standard_model_targets:
  - active lepton doublets
  - Higgs doublet
  - electroweak plasma
  dark_sector_couplings:
  - F_alpha1 L_alpha H N1
  - Majorana mass M1 for N1
  mediator_types:
  - active-sterile mixing
  - finite-temperature electroweak matter potential
  interaction_operators:
  - N1 Majorana mass term
  - neutrino Yukawa interaction with L_alpha and conjugate Higgs
  scattering:
    elastic: unknown
    inelastic: unknown
    momentum_dependence: strong
    velocity_dependence: unknown
    spin_dependence: unknown
  annihilation_channels: []
  decay_channels:
  - N1 to active neutrinos
  - radiative N1 to active neutrino plus photon
  self_scattering_channels: []
  cp_structure: CP violation in the heavier right-handed neutrino sector generates the lepton asymmetry;
    the N1 abundance calculation uses the absolute asymmetry as input.
  flavor_structure: The paper studies limiting flavour structures for the N1 Dirac mass elements and assumes
    equal active-species lepton asymmetries for the main calculation.
  tree_or_loop_level: both
