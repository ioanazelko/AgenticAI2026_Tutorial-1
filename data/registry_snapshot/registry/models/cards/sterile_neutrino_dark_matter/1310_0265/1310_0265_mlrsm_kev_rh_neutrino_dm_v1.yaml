theory_to_observable_routing:
  routes:
  - id: mlrsm_neutrino_dm_to_observables
    description: Combine MLRSM neutrino masses and right-handed currents with N1 relic abundance, X-ray
      decay, Lyman-alpha, 0nu beta beta, and collider constraints.
    source_model_features:
    - SU(2)_L x SU(2)_R x U(1)_{B-L} gauge structure
    - keV lightest right-handed neutrino dark matter
    - heavier right-handed neutrino entropy injection
    input_parameters:
    - M1
    - M2
    - M3
    - M_W_R
    - v_R
    - theta
    - Y_Delta_ee
    derived_quantities:
    - N1 relic density before and after dilution
    - radiative decay rate
    - 0nu beta beta effective amplitude
    - collider production cross section
    forward_model_chain:
    - step_id: thermal_abundance
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - M1
      - M_W_R
      - g_star
      outputs:
      - Omega_N1 before dilution
      validity: Applies when N1 is thermally produced through right-handed interactions.
      notes: Primary text quotes the abundance scaling.
    - step_id: entropy_and_structure
      step_type: semi_analytic_model
      tool_or_code: entropy-injection plus warm-DM transfer estimate
      inputs:
      - M2
      - M3
      - N1 momentum distribution
      outputs:
      - diluted abundance
      - Lyman-alpha viability
      validity: Requires a production-specific momentum distribution for precision.
      notes: null
    - step_id: laboratory_and_collider
      step_type: recasting
      tool_or_code: 0nu beta beta and LHC recasts
      inputs:
      - mixing matrix
      - v_R
      - gauge boson masses
      outputs:
      - 0nu beta beta rate
      - collider exclusions
      validity: Nuclear matrix elements and branching fractions must be specified.
      notes: null
    observable_ids:
    - kev_n1_structure_suppression
    - n1_xray_decay_line
    - neutrinoless_double_beta_lr_signal
    - lr_gauge_boson_collider_bounds
    constraint_ids:
    - thermal_overproduction_entropy_dilution
    - lyman_alpha_n1_mass_bound
    - xray_mixing_decay_bound
    - neutrinoless_double_beta_np_window
    - collider_lr_gauge_boson_bounds
    likelihoods: []
    required_code_resources:
    - sterile-neutrino decay calculator
    - warm-DM transfer-function recast
    - 0nu beta beta nuclear-matrix-element inputs
    - LHC LR-model recast
    validation_tests:
    - Recover quoted Omega_N1 scaling
    - Recover M1 > 1 keV and M_W_R 10-16 TeV thermal-dilution benchmark
    route_status: planned
    agent_notes: null
    caveats:
    - Several constraints are cited or graphical in the primary paper and need external recasts for precision.
