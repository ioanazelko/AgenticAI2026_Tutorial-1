  assumptions:
  - can_be_relaxed: partial
    description: The sterile state mixes with electron-flavor neutrinos for beta-spectrum observability.
    id: assume_electron_flavor_coupling
    impact_if_violated: Different flavor structure changes laboratory sensitivity.
    notes: null
    scope: laboratory searches
    source_reference_ids:
    - src_1909_13328_primary
    status: assumed
  benchmark_implications:
  - The paper notes KATRIN, TRISTAN, HUNTER, and PTOLEMY as probes of all or part of relevant eV/keV sterile-neutrino
    parameter space.
  caveats:
  - No experimental response model is included.
  constrained_parameters:
  - m_s
  - '|U_es|^2'
  constraint_type: laboratory
  data_release: null
  excluded_regions: []
  id: con_lab_mass_mixing_reach
  likelihood_available: unknown
  likelihood_reference: null
  name: Laboratory reach for eV-to-keV sterile-neutrino mixing
  notes: null
  observable_channel: beta-spectrum and neutrino-capture probes
  recasting_needed: 'yes'
  robustness: medium
  source_reference_ids:
  - src_1909_13328_primary
theory_to_observable_routing:
  routes:
  - agent_notes: This is the core route for comparing cosmology-dependent sterile-neutrino predictions.
    caveats:
    - Full numeric contours are not included.
    constraint_ids:
    - con_bbn_transition_prebbn
    - con_lyman_xray_standard_dw
    - con_mass_mixing_cosmology_dependence
    - con_lab_mass_mixing_reach
    derived_quantities:
    - f_s(p)
    - Omega_s h^2
    - dark-matter fraction
    - X-ray decay rate
    - linear power suppression
    description: Solve sterile-neutrino non-resonant production in a chosen pre-BBN cosmology, then route
      abundance and spectrum to astrophysical and laboratory limits.
    forward_model_chain:
    - inputs:
      - cosmology type
      - T_tr
      notes: null
      outputs:
      - H(T)
      - entropy evolution
      step_id: prebbn_history
      step_type: analytic_formula
      tool_or_code: null
      validity: benchmark cosmologies described in the primary paper
    - inputs:
      - H(T)
      - m_s
      - mixing angle
      - active-neutrino collision rate
      notes: null
      outputs:
      - f_s(p)
      - Omega_s h^2
      step_id: sterile_boltzmann
      step_type: boltzmann_solver
      tool_or_code: null
      validity: non-resonant production without significant primordial lepton asymmetry
    - inputs:
      - f_s(p)
      - Omega_s h^2
      - decay rate
      notes: null
      outputs:
      - Lyman-alpha relevance
      - X-ray constraints
      - lab mass-mixing reach
      step_id: limit_mapping
      step_type: recasting
      tool_or_code: null
      validity: requires constraint-specific recasts
    id: route_prebbn_boltzmann_to_limits
    input_parameters:
    - m_s
    - sin^2(2theta)
    - H(T)
    - T_tr
    - entropy history
    likelihoods: []
    observable_ids:
    - obs_nonstandard_sterile_abundance
    - obs_lyman_alpha_structure
    - obs_xray_decay_line
    - obs_beta_spectrum_lab_kinks
    required_code_resources:
    - sterile-neutrino production solver
    - linear power or WDM mapping code
    - X-ray decay recast
    - laboratory response/reach curves
    route_status: planned
    source_model_features:
    - sterile-active mixing
    - non-standard H(T) before T_tr
    - possible entropy production in low-reheating histories
    validation_tests:
    - Reproduce standard Dodelson-Widrow abundance and the paper benchmark trends for kination, scalar-tensor,
      and low-reheating cosmologies.
