theory_to_observable_routing:
  routes:
  - id: excited_bound_state_to_constraints
    description: Compute bound-state formation and transitions, evolve mediator freeze-out and decay,
      then compare relic-density, Lyman-alpha, unitarity, and collider constraints.
    source_model_features:
    - singlet Majorana dark matter
    - colored electrically charged scalar mediator
    - highly excited bound states
    - superWIMP late-decay regime
    input_parameters:
    - m_chi
    - m_tilde_q
    - lambda
    - gauge couplings
    - n_max
    - tau_mediator
    derived_quantities:
    - effective annihilation/depletion rate
    - mediator yield at decay
    - Omega_chi
    - nonthermal momentum distribution
    forward_model_chain:
    - step_id: matrix_elements
      step_type: analytic_formula
      tool_or_code: potential non-relativistic EFT
      inputs:
      - Coulomb potentials
      - effective couplings
      - n_max
      outputs:
      - BSF and transition rates
      validity: Valid in the perturbative nonrelativistic regime.
      notes: null
    - step_id: network_evolution
      step_type: boltzmann_solver
      tool_or_code: bound-state network plus mediator yield equations
      inputs:
      - rates
      - lambda
      - masses
      outputs:
      - mediator abundance until decay
      validity: Must include enough excited states for convergence.
      notes: null
    - step_id: constraint_recast
      step_type: recasting
      tool_or_code: relic, Lyman-alpha, unitarity, and LHC checks
      inputs:
      - Omega_chi
      - momentum distribution
      - tau_mediator
      - mediator mass
      outputs:
      - allowed/excluded parameter regions
      validity: Requires external transfer-function and collider likelihoods for precision.
      notes: null
    observable_ids:
    - excited_bound_state_relic_depletion
    - mediator_lifetime_relic_dependence
    - lyman_alpha_relaxed_superwimp_bound
    - long_lived_colored_mediator_lhc
    constraint_ids:
    - bound_state_relic_recalculation
    - perturbative_unitarity_bound
    - lyman_alpha_superwimp_bound
    - collider_long_lived_mediator
    likelihoods: []
    required_code_resources:
    - BSF/high-n transition rate code
    - Boltzmann network solver
    - Lyman-alpha transfer-function recast
    - LLP collider recast
    validation_tests:
    - Recover the paper claim that excited states can reduce relic density by more than an order of magnitude
    - Check convergence as n_max increases
    route_status: planned
    agent_notes: null
    caveats:
    - The LHC and Lyman-alpha constraints are not fully implemented in the local artifacts.
