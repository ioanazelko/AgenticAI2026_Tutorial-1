    candidate obtains its mass radiatively and is produced by freeze-in through a broken B-L gauge interaction.
  historical_origin_or_motivation: The paper motivates the construction as a Dirac-neutrino scotogenic
    model that also generates a light fermionic dark matter mass through loop diagrams.
  status: speculative
