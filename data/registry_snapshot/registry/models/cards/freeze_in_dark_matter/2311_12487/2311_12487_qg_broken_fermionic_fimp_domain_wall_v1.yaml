    symbol: Lambda_FI
    value: null
    unit: GeV
    role: core
    status: unknown
    source_reference_ids:
    - '2311_12487'
    notes: Dimension-five freeze-in operators are suppressed by Lambda_FI.
  embedded_in_larger_framework: 'yes'
  notes: The EFT augments the Standard Model with a singlet fermion and singlet scalar, with approximate
    discrete symmetries broken by dimension-five QG-suppressed operators.
