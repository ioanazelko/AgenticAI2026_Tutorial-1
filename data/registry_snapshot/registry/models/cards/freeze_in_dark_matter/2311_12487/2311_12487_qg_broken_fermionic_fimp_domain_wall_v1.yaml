symmetries:
  stabilizing_mechanism: An approximate Z2^DM makes the singlet fermion long-lived, but QG-induced dimension-five
    operators break the symmetry and allow slow decays through mixing with active neutrinos.
  symmetries:
  - name: Z2^DM
    type: discrete
    exact_or_approximate: broken
    breaking: Explicitly broken by QG-suppressed dimension-five operators involving S, lepton doublets,
      and the Higgs.
    breaking_scale:
      name: quantum-gravity breaking scale
      symbol: Lambda_QG
      value: 10^20-10^35
      unit: GeV
      role: core
      status: inferred
      source_reference_ids:
      - '2311_12487'
      notes: Range discussed for phenomenological considerations.
  - name: Z2^DW
    type: discrete
    exact_or_approximate: broken
    breaking: Spontaneously broken by the scalar S vev and explicitly biased by QG-suppressed operators,
      causing domain-wall annihilation.
    breaking_scale:
      name: scalar vev
      symbol: v_s
      value: null
      unit: GeV
      role: core
      status: unknown
      source_reference_ids:
      - '2311_12487'
      notes: Benchmarks include v_s=10^10 GeV for relic-density illustration and v_s=2.21e6 GeV for a
        gravitational-wave example.
  topological_defects_possible: 'yes'
