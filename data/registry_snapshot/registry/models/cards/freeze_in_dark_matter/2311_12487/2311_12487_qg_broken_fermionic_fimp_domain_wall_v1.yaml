identity:
  name: Quantum-gravity-broken fermionic FIMP with domain walls
  family: freeze_in_dark_matter
  aliases:
  - fermionic dark matter with QG-broken Z2 symmetries
  - FIMP dark matter and domain walls from broken discrete global symmetries
  short_description: A singlet fermion dark matter candidate odd under an approximate Z2^DM symmetry is
    produced by freeze-in through dimension-five operators, while a singlet scalar odd under Z2^DW forms
    domain walls whose annihilation is driven by quantum-gravity symmetry breaking.
  historical_origin_or_motivation: Introduced as a fermionic extension of an earlier scalar dark matter/domain-wall
    scenario to connect freeze-in dark matter, decays induced by quantum gravity, and gravitational waves
    from domain-wall annihilation.
  status: speculative
  model_kind: effective_field_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - Refined Swampland Global Symmetry Conjecture
  - string-inspired singlet sectors
  - freeze-in dark matter
  lagrangian_available: 'yes'
  renormalizable: 'no'
