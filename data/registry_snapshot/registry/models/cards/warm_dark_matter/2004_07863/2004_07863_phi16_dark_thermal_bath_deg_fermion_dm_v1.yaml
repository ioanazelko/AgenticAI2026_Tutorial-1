    produced when inflaton decays populate a phi_16 dark thermal bath that later decays to DM pairs.
  historical_origin_or_motivation: Introduced to connect a degenerate sub-keV fermion dark matter solution
    to dwarf-galaxy cores with a broken U(1)_{B-L} explanation of neutrino masses and leptogenesis.
  status: speculative
  model_kind: complete_theory
