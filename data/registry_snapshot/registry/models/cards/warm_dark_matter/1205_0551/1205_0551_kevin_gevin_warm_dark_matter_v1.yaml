  family: warm_dark_matter
  aliases:
  - keV inert fermion warm dark matter
  - keVin WDM with GeVin entropy dilution
  short_description: A simple warm dark matter model adding a stable keV inert fermion and a heavier unstable
    GeV inert fermion to the Standard Model, with suppressed Z couplings and late GeVin decay entropy
    dilution.
  historical_origin_or_motivation: Motivated by warm dark matter candidates with keV masses and by the
    need to obtain the correct abundance through thermal overproduction followed by entropy dilution.
  status: speculative
  model_kind: simplified_model
