parameters:
  core:
  - name: component mass
    symbol: m_a
    description: Mass of a dark-matter species contributing to the mixture.
    range: component-dependent, including keV sterile-neutrino examples and 100 GeV WIMP examples
    unit: eV to GeV
    role: core
    status: inferred
    source_reference_ids:
    - primary
  - name: component dark-matter fraction
    symbol: nu_a
    description: Fraction of the total dark matter density in component a.
    range: 0 to 1 with sum over components equal to 1
    role: core
    status: inferred
    source_reference_ids:
    - primary
  - name: effective relativistic degrees of freedom at decoupling
    symbol: g_d,a
    description: Sets the temperature ratio and enters the relic-abundance/free-streaming formula.
    range: component-dependent
    role: core
    status: inferred
    source_reference_ids:
    - primary
  - name: decoupled distribution function
    symbol: f_d,a(y)
    description: Arbitrary isotropic distribution function inherited from decoupling, including LTE and
      out-of-LTE cases.
    role: core
    status: established
    source_reference_ids:
    - primary
  - name: distribution integral ratio
    symbol: I_a
    description: Dimensionless ratio of integrals over the decoupled distribution controlling velocity
      dispersion and free streaming.
    role: derived
    status: established
    source_reference_ids:
    - primary
  - name: WIMP decoupling temperature
    symbol: T_d
    description: Decoupling temperature for a heavy non-relativistic thermal relic component.
    value: 10 MeV example for a 100 GeV WIMP
    unit: MeV
    role: cosmological
    status: inferred
    source_reference_ids:
    - primary
  nuisance: []
  derived:
  - name: comoving free-streaming length
    symbol: lambda_fs(z)
    description: Combined free-streaming scale of the dark-matter mixture at redshift z.
    range: weighted by component fractions, masses, decoupling degrees of freedom, and distribution integrals
    unit: kpc
    role: derived
    status: established
    source_reference_ids:
    - primary
