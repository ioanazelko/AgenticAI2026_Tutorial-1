    name: mixture of collisionless non-relativistic dark matter components
    spin: component-dependent
    statistics: unknown
    elementary_or_composite: unknown
    number_of_components: multi_component
  additional_dark_sector_particles:
  - fermionic thermal relics
  - non-condensed bosonic thermal relics
  - Bose-Einstein-condensed bosonic component
  - heavy non-relativistic thermal relics (WIMPs)
  - resonantly or non-resonantly produced sterile neutrinos
  mediators:
