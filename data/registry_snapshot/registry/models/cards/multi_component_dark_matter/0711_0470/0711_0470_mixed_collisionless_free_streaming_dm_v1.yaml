identity:
  name: Mixed collisionless dark matter free-streaming model
  family: multi_component_dark_matter
  aliases:
  - mixed dark matter free-streaming
  - multicomponent collisionless dark matter
  - Boltzmann-Vlasov mixed DM
  short_description: A phenomenological multi-component dark-matter model in which fermionic and bosonic
    relics, WIMPs, and sterile-neutrino components contribute fractions of the density and determine a
    combined free-streaming scale through their decoupled distribution functions.
  historical_origin_or_motivation: Developed to compute free streaming for mixtures of cold and warm components
    without truncating their distribution functions, motivated by small-scale structure issues in pure
    CDM.
  status: speculative
  model_kind: phenomenological_parameterization
theory:
  theory_level: phenomenological_parameterization
  parent_frameworks:
  - collisionless Boltzmann-Vlasov theory
  - multicomponent dark matter
  - linear gravitational perturbation theory
  lagrangian_available: 'no'
  renormalizable: not_applicable
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper specifies component distribution functions, decoupling histories, fractional abundances,
    and gravitational collective response rather than a UV particle Lagrangian.
