identity:
  name: Inert-doublet multi-Higgs-inflation dark matter
  family: inert_doublet_dark_matter
  aliases:
  - multi-Higgs inflation inert Higgs dark matter
  - heavy inert Higgs dark matter with approximate U(1)_H
  short_description: A two-Higgs-doublet inert model variant in which nonminimal gravity couplings and
    an approximate U(1)_H symmetry give multi-field Higgs inflation, while the lightest neutral inert
    scalar H^0 is stabilized by the inert parity and can be dark matter only in the heavy, nearly degenerate
    H^0/A^0 regime around 600 GeV.
  historical_origin_or_motivation: Developed to connect extended Higgs inflation, vacuum stability, and
    inert-doublet dark matter phenomenology.
  status: speculative
  model_kind: complete_theory
theory:
  theory_level: effective_field_theory
  parent_frameworks:
  - two Higgs doublet model
  - inert doublet model
  - Higgs inflation with nonminimal gravity couplings
  lagrangian_available: 'yes'
  renormalizable: 'no'
  eft_cutoff:
    name: unitarity scale from nonminimal gravity coupling
    symbol: Lambda_U
    description: Scale at which large nonminimal Higgs-gravity couplings can violate perturbative unitarity
      in the vacuum.
    value: min(1/xi_1, 1/xi_2) in Planck units
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper imposes perturbativity and stability conditions at this scale.
  embedded_in_larger_framework: 'yes'
  notes: The scalar potential is the renormalizable two-Higgs-doublet potential with Z2 parity and nonminimal
    gravity couplings, treated as an inflationary effective theory.
particle_content:
  dark_matter_candidate:
    name: H^0
    spin: '0'
    statistics: scalar
    elementary_or_composite: elementary
    number_of_components: single_component
  additional_dark_sector_particles:
  - CP-odd inert scalar A^0 nearly degenerate with H^0
  - charged inert scalars H^+ and H^-
  - second Higgs doublet Phi_2
  mediators:
  - Standard Model Higgs h
  - Z boson in coannihilation
  - weak gauge bosons
  dark_radiation_species: []
  excited_or_degenerate_states:
  - A^0 nearly degenerate with H^0 when lambda_5 is very small
  long_lived_particles: []
  unstable_parent_particles: []
  standard_model_extension: substantial
symmetries:
  stabilizing_mechanism: An exact inert Z2 parity prevents the second Higgs doublet from coupling to Standard
    Model fermions and stabilizes the lightest neutral inert scalar; an approximate U(1)_H keeps lambda_5
    very small in the multi-Higgs inflation case.
  symmetries:
  - name: inert Z2 parity
    type: discrete
    exact_or_approximate: exact
    breaking: Unbroken in the low-energy inert doublet setup used for dark matter.
    breaking_scale: null
  - name: U(1)_H
    type: global
    exact_or_approximate: approximate
    breaking: Only tiny U(1)_H-breaking quartic couplings such as lambda_5 are allowed during multi-Higgs
      inflation.
    breaking_scale: null
  topological_defects_possible: unknown
interactions:
  portals:
  - higgs
  - vector
  standard_model_targets:
  - Standard Model fermions
  - W bosons
  - Z bosons
  - Higgs bosons
  dark_sector_couplings:
  - lambda_L + lambda_5 coupling controlling H^0 H^0 annihilation through the Higgs
  - gauge coannihilation through Z exchange with A^0
  - weak gauge interactions of the inert doublet
  mediator_types:
  - Standard Model Higgs
  - Z boson
  - weak gauge bosons
  interaction_operators:
  - two-Higgs-doublet scalar quartic terms lambda_i
  - nonminimal gravity couplings xi_1 and xi_2
  scattering:
    elastic: 'yes'
    inelastic: 'yes'
    momentum_dependence: unknown
    velocity_dependence: mild
    spin_dependence: spin_independent
  annihilation_channels:
  - H^0 H^0 -> Standard Model fermion pairs through Higgs quartic coupling
  - H^0 H^0 -> W W and Z Z when kinematically open
  - coannihilation with A^0 through gauge interactions
  decay_channels: []
  self_scattering_channels: []
  cp_structure: H^0 is CP-even and A^0 is CP-odd in the inert doublet notation used by the paper.
  flavor_structure: The inert doublet is taken not to couple to Standard Model fermions, avoiding additional
    flavor violation.
  tree_or_loop_level: tree
parameters:
  core:
  - name: dark matter mass
    symbol: m_H0
    description: Mass of the lightest neutral inert scalar in the multi-Higgs inflation dark matter regime.
    range: around 600 GeV
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper states that only heavy dark matter with mass around 600 GeV is possible in this approximate
      U(1)_H case.
  - name: CP-odd inert scalar mass
    symbol: m_A0
    description: Mass of the CP-odd inert scalar, nearly degenerate with H^0 when lambda_5 is tiny.
    range: around 600 GeV and nearly degenerate with m_H0
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The small splitting drives important coannihilation.
  - name: U(1)_H-breaking quartic
    symbol: lambda_5
    description: Quartic coupling that controls the H^0/A^0 splitting and breaks U(1)_H.
    range: typically less than about 1e-7 in most multi-Higgs-inflation parameter space
    unit: null
    role: core
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper says lambda_5 remains small under running because of approximate U(1)_H.
  - name: nonminimal gravity couplings
    symbol: xi_1, xi_2
    description: Positive nonminimal couplings of the two Higgs doublets to gravity.
    range: model dependent
    unit: null
    role: core
    status: assumed
    source_reference_ids:
    - '1202.0288'
    notes: These couplings define the inflationary dynamics.
  nuisance: []
  derived:
  - name: relic abundance target band
    symbol: Omega_H0 h^2
    description: Thermal relic-density band used in the paper.
    range: 0.094 to 0.136 for full WMAP-consistent abundance; also considers below 0.136 as a subcomponent
    unit: null
    role: derived
    status: inferred
    source_reference_ids:
    - '1202.0288'
    notes: The paper permits another dark matter component if H^0 is underabundant.
