  - id: nonthermal_decay_to_delta_neff
    description: Map a heavy-parent decay benchmark to Delta N_eff, free-streaming suppression, and late-decay
      cosmological bounds.
    source_model_features:
    - heavy parent decays to stable dark matter plus a photon
    - small relativistic nonthermal dark matter fraction
    - mostly cold dark matter abundance remains present
    - bino-like neutralino parent decays to gravitino dark matter
    input_parameters:
    - M_G
    - M_B
    - tau_B
    - f
    - Delta N_eff
    derived_quantities:
    - boost factor at equality
    - Delta N_eff
    - mixed-DM transfer-function suppression
    - electromagnetic energy release
    forward_model_chain:
    - step_id: boost_and_neff
      step_type: analytic_formula
      tool_or_code: null
      inputs:
      - M_G
      - M_B
      - tau_B
      - f
      - Delta N_eff
      outputs:
      - gamma
      - Delta N_eff
      validity: Valid for two-body parent decay with a small nonthermal dark matter fraction.
      notes: Use the primary paper formula relating lifetime, mass ratio, f, and Delta N_eff.
    - step_id: structure_bound
      step_type: transfer_function
      tool_or_code: mixed cold plus boosted component calculation
      inputs:
