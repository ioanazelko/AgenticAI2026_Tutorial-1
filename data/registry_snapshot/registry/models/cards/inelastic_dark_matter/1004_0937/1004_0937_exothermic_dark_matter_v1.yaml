    description: Scale of the low-energy inelastic scattering operators.
    value: about 340
    unit: GeV
    role: core
    status: inferred
    source_reference_ids:
    - '1004_0937'
    notes: Quoted as the approximate scale needed for a cross section of order 10^-39 cm^2 for few-GeV
      dark matter.
  embedded_in_larger_framework: 'yes'
  notes: The paper first uses effective inelastic operators, then sketches a dark photon with kinetic
    mixing as a more complete realization.
