identity:
  name: Exothermic dark matter
  family: inelastic_dark_matter
  aliases:
  - exoDM
  short_description: A light multi-state dark matter scenario in which a metastable excited state down-scatters
    off nuclei to a lower state, depositing the dark-sector mass splitting as nuclear recoil energy.
  historical_origin_or_motivation: The paper proposes exothermic downscattering as a direct-detection
    mechanism that can fit DAMA/LIBRA with light dark matter while avoiding several low-threshold null
    searches in the analyzed parameter region.
  status: speculative
  model_kind: simplified_model
theory:
