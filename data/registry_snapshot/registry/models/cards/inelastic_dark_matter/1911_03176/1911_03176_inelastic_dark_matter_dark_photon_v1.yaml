  - dark photon kinetic mixing
  lagrangian_available: 'yes'
  renormalizable: 'yes'
  eft_cutoff: null
  embedded_in_larger_framework: unknown
  notes: The paper writes a dark-sector fermion and scalar Lagrangian and a renormalizable kinetic-mixing
    Lagrangian for the dark photon.
