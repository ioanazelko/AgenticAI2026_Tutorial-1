  - dark photon inelastic DM
  short_description: A simplified light thermal dark matter setup with two Majorana states chi_1 and chi_2
    coupled off-diagonally to a kinetically mixed dark photon.
  historical_origin_or_motivation: The paper uses this setup to evade CMB and direct-detection difficulties
    for light thermal dark matter and to define displaced-vertex targets.
  status: speculative
  model_kind: simplified_model
theory:
